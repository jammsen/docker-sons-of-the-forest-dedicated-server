---
name: Unit-test
on:
  push:
    branches:
      - develop      # Run tests on commit to the develop branch
      - master       # Run tests on commit to the master branch
  pull_request:      # Run tests on all pull requests
  workflow_call:     # Allow this workflow to be called by other workflows

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  unit-test-amd64:
    name: Docker - Test Linux-amd64 image
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Get Runner Info
        run: |
            id
            pwd
            git --version
            docker version
            free -m
            cat /proc/cpuinfo | grep "model name"
            echo "Repository value of TIMEOUT_SECONDS is: ${{ vars.TIMEOUT_SECONDS }}"
            echo "This should not be set on a PR from a different source!"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          load: true
          tags: ${{ github.run_id }}
          platforms: linux/amd64

      - name: Run server
        run: |
            docker run -d \
            --name sons-of-the-forest-dedicated-server \
            -p 8766:8766/udp \
            -p 27016:27016/udp \
            -p 9700:9700/udp \
            -e PUID=7351 \
            -e PGID=2431 \
            -v ./game:/sonsoftheforest/ \
            --restart unless-stopped \
            --stop-timeout 30 \
            ${{ github.run_id }}

      - name: Wait for server to start
        run: |
            START_TIME=$(date +%s)
            TIMEOUT_SECONDS=${{ vars.TIMEOUT_SECONDS || '300' }}
            echo "TIMEOUT_SECONDS: $TIMEOUT_SECONDS"
            
            # Set the timezone to Germany (Central European Time)
            export TZ=Europe/Berlin
            
            # Source color functions
            source ./includes/colors.sh
            
            # Track last log position to avoid duplicate output
            LAST_LOG_LINES=0
            
            while ! docker logs sons-of-the-forest-dedicated-server 2>&1 | grep -q "#DSL Dedicated server loaded."; do
              CURRENT_TIME=$(date +%s)
              ELAPSED_TIME=$((CURRENT_TIME - START_TIME))
            
              if [ $ELAPSED_TIME -gt $TIMEOUT_SECONDS ]; then
                echo "Timeout reached. Server failed to start within $TIMEOUT_SECONDS seconds."
                es "*****Final Container LOGS*****"
                docker logs sons-of-the-forest-dedicated-server
                exit 1
              fi
            
              # Show current status with warning color
              ew ">>> $(date '+%H:%M:%S') - Waiting for server to start... (${ELAPSED_TIME}s elapsed)"
              
              # Get current log lines count and show new logs if any
              CURRENT_LOG_LINES=$(docker logs sons-of-the-forest-dedicated-server 2>&1 | wc -l)
              if [ $CURRENT_LOG_LINES -gt $LAST_LOG_LINES ]; then
                # Print green box header (120 chars wide)
                es_nn "╭"
                for i in $(seq 1 118); do es_nn "─"; done
                es "╮"
                es_nn "│"
                printf "%-118s" " Recent container logs"
                es "│"
                
                # Get new log lines and format them in the box
                docker logs sons-of-the-forest-dedicated-server 2>&1 | tail -n +$((LAST_LOG_LINES + 1)) | head -n $((CURRENT_LOG_LINES - LAST_LOG_LINES)) | while IFS= read -r line; do
                  # Truncate long lines to fit in box (116 chars to leave space for padding)
                  if [ ${#line} -gt 116 ]; then
                    truncated_line="${line:0:113}..."
                  else
                    truncated_line="$line"
                  fi
                  
                  # Add box borders with proper padding
                  es_nn "│"
                  printf " %-116s " "$truncated_line"
                  es "│"
                done
                
                # Print green box footer
                es_nn "╰"
                for i in $(seq 1 118); do es_nn "─"; done
                es "╯"
                
                LAST_LOG_LINES=$CURRENT_LOG_LINES
              fi
              
              echo "---"
              sleep 5
            done
            
            echo "Server successfully started"
            es "*****Final Container LOGS*****"
            docker logs sons-of-the-forest-dedicated-server

      - name: Test if port 8766, 27015 and 27016 are listening
        run: |
            nc -z -u -v 127.0.0.1 8766 || exit 2
            nc -z -u -v 127.0.0.1 27016 || exit 3
            nc -z -u -v 127.0.0.1 9700 || exit 4

      - name: Stop server
        if: always()
        run: |
            docker stop sons-of-the-forest-dedicated-server
            docker rm sons-of-the-forest-dedicated-server
            docker rmi ${{ github.run_id }}